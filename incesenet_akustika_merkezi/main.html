<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17162d">
    <title>Welcome to Akustik İncəsənət Mərkəzi</title>
    <style>
        html, body { background: #17162d; }
    </style>
    <link href="./main.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="inside_header">
            <span class="logo">
                <img src="./logo.jpg">
            </span>
            <div class="info">
                <span><a href="#">Kurslar</a></span>
                <span><a href="#">Itisaslaşma sahəsi</a></span>
                <span><a href="#">Biz haqqında</a></span>
            </div>
            <div class="search">
                <input type="text" placeholder="Sorğunuz deyin">
                <button type="button" aria-label="Axtar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.3"></circle>
                        <path d="m15.5 15.5 4.2 4.2"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="downside">
            <span class="title">
                <h1>İncəsənət Mərkəzi</h1>
                <p>İncəsənət Mərkəzi, musiqi və sənət sahəsində təhsil və inkişaf üçün nəzərdə tutulmuş bir mərkəzdir. Burada müxtəlif musiqi alətləri üzrə kurslar və dərslər təklif olunur.</p>
                <div class="title-actions">
                    <a class="title-action" href="./selection.html?choice=oxu">Oxu</a>
                    <a class="title-action" href="./selection.html?choice=oyren">Öyrən</a>
                    <a class="title-action" href="./selection.html?choice=yarat">Yarat</a>
                </div>
            </span>
            <span class="list">
                <button type="button" class="toggle-button">Qitara</button>
                <button type="button" class="toggle-button">Saz</button>
                <button type="button" class="toggle-button">Zurna</button>
                <button type="button" class="toggle-button">Tar</button>
                <button type="button" class="toggle-button">Skripka</button>
            </span>
            <div class="tog-but">
                <div class="insidetgg" aria-live="polite"></div>
            </div>
        </div>
    </main>
    <script src="./js/toggle-button.js"></script>
    <script src="./js/title-navigation.js"></script>
</body>
</html>
